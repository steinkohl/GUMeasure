#:schema ../schema/datasheet.schema.json
# Typed from the Siglent data sheet "SDM3065X Series Digital Multimeter", DataSheet-2021.05.
# Check every value against the document before a release.
schema = "gumeasure.datasheet/1"
model  = "SDM3065X"
vendor = "Siglent Technologies"
source = "Siglent SDM3065X Series Digital Multimeter data sheet, DataSheet-2021.05, tables DC Characteristics, AC Characteristics, Frequency and Period Characteristics and Capacitance Characteristic. 24 h column at TCAL ±1 °C, 90 d and 1 year at TCAL ±5 °C. DC for 90-minute warm-up and 100 NPLC, add the RMS noise adder below 100 NPLC. 2-wire resistance needs REL or 0.2 Ω more. DCV above ±500 V adds 0.03 mV per volt. AC for sine waves above 5 % of range and the slow filter. Frequency for 1 s gate time. Capacitance with REL. Values typed from the PDF, to be checked against it before a release"
# TCAL is the calibration temperature of the certificate. The data sheet gives no number.
band      = "5 K"   # TODO: check this. The 24 h column holds at TCAL ±1 °C only.
intervals = ["24 h", "90 d", "1 year"]

