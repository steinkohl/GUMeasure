#:schema ../schema/datasheet.schema.json
# Typed from the Korad "KC Series 4-Channel Programmable Power Supply User Manual",
# Parameters Table, column KC3405. The manual states no readback accuracy, so only the
# setup accuracy of the outputs is given. Check every value against the document before a
# release.
schema = "gumeasure.datasheet/1"
model  = "KC3405"
vendor = "Shenzhen Korad Technology"
source = "Korad KC Series 4-Channel Programmable Power Supply User Manual, Parameters Table, column KC3405, Setup Accuracy (25 °C ± 5 °C). Same for all four channels. The manual gives no readback accuracy and no temperature coefficient. No revision printed. Values typed from the PDF, to be checked against it before a release"
tcal   = "25 °C"
band   = "5 K"

# Settings: the value is the set value, the accuracy the setup accuracy of the output.
[function."setting.voltage"]
unit = "V"

[[function."setting.voltage".range]]
full_scale          = "30 V"
resolution          = "1 mV"
resolution_included = true   # the set value is exact
accuracy            = [{ of_reading = "0.05 %", offset = "3 mV" }]

[function."setting.current"]
unit = "A"

[[function."setting.current".range]]
full_scale          = "5 A"
resolution          = "0.1 mA"
resolution_included = true
accuracy            = [{ of_reading = "0.05 %", offset = "2 mA" }]

# Worked examples, computed by hand from the values above.
[[check]]   # 0.05 % × 12 V + 3 mV
function   = "setting.voltage"
range      = "30 V"
reading    = "12 V"
half_width = "9 mV"

[[check]]   # 0.05 % × 1 A + 2 mA
function   = "setting.current"
range      = "5 A"
reading    = "1 A"
half_width = "2.5 mA"
