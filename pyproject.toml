[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gumeasure"
version = "0.1.0"
description = "Measurement uncertainty according to the GUM for every reading of a lab instrument"
readme = "README.md"
requires-python = ">=3.11"
# MIT or Apache, at the choice of the user
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Felix Steinkohl" }]
keywords = ["GUM", "measurement uncertainty", "metrology", "calibration", "pint", "pymeasure"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["pint>=0.24", "numpy>=1.26", "pydantic>=2.7"]

[project.optional-dependencies]
pymeasure = ["pymeasure>=0.14"]

[project.scripts]
gumeasure = "gumeasure.cli:main"

[project.urls]
Repository = "https://github.com/steinkohl/GUMeasure"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "hypothesis", "pymeasure>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/gumeasure"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # µ, ±, × and similar signs are intended

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pymeasure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::FutureWarning:pymeasure.*"]
